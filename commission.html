<!DOCTYPE html>
<html lang="en">
<head>

<title>Commission — Jodie Luk Lai Wa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; }
  body { font-family: "Noto Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: #111111; text-decoration: none; }
  a:hover { color: #111111; }
  * { box-sizing: border-box; }
  html.js [data-reveal] { opacity: 0; transform: translateY(18px); transition: opacity 900ms cubic-bezier(.22,.61,.36,1), transform 900ms cubic-bezier(.22,.61,.36,1); }
  html.js [data-reveal].is-in { opacity: 1; transform: none; }
  html.js [data-band] { scrollbar-width: none; -ms-overflow-style: none; }
  html.js [data-band]::-webkit-scrollbar { display: none; }
  .footer-icon { display: block; background-color: #616161; }
  .footer-icon:hover { background-color: #111111; }
  .arrow-btn { appearance: none; background: none; border: 0; padding: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div style="background: #ffffff; color: #111111; min-height: 100vh; position: relative; overflow-x: hidden">

  <header style="position: fixed; top: 0; left: 0; right: 0; z-index: 30; display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; padding: 22px clamp(16px, 3vw, 40px); background: transparent">
    <a href="index.html" style="font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; white-space: nowrap">Jodie Luk Lai Wa</a>
    <nav style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase">

      <a href="commission.html" style="text-decoration: underline; text-underline-offset: 3px; white-space: nowrap; font-size: 12px; color: #616161">COMMISSION</a>
      <a href="about.html" style="text-decoration: underline; text-underline-offset: 3px; font-size: 12px">About</a>
    </nav>
  </header>

  <main style="position: relative; z-index: 10; padding: 26vh clamp(16px, 3vw, 40px) 10vh">
    <div style="width: min(1320px, 100%); margin: 0 auto; display: flex; flex-direction: column; gap: clamp(72px, 12vh, 140px)">

      <section data-reveal style="display: flex; flex-direction: column; gap: 22px">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px">
          <h2 style="margin: 0; font-size: 12px; font-weight: 400; letter-spacing: 0.1em; text-transform: uppercase">Selected editing work</h2>
          <div style="display: flex; align-items: center; gap: 4px">
            <button type="button" class="arrow-btn" data-band-prev="0" aria-label="Previous">
              <span style="display: block; width: 8px; height: 8px; border-top: 1px solid #111111; border-right: 1px solid #111111; transform: rotate(225deg)"></span>
            </button>
            <button type="button" class="arrow-btn" data-band-next="0" aria-label="Next">
              <span style="display: block; width: 8px; height: 8px; border-top: 1px solid #111111; border-right: 1px solid #111111; transform: rotate(45deg)"></span>
            </button>
          </div>
        </div>
        <div data-band style="display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 8px">
          <div style="flex: 0 0 calc(50% - 8px); aspect-ratio: 16 / 9; background: #f2f2f2; scroll-snap-align: start">
            <iframe src="https://www.youtube-nocookie.com/embed/57mNXK4wW8A" title="Selected editing work 1" loading="lazy" allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" style="display: block; width: 100%; height: 100%; border: 0"></iframe>
          </div>
          <div style="flex: 0 0 calc(50% - 8px); aspect-ratio: 16 / 9; background: #f2f2f2; scroll-snap-align: start">
            <iframe src="https://www.youtube-nocookie.com/embed/sUsqjXndojk" title="Selected editing work 2" loading="lazy" allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" style="display: block; width: 100%; height: 100%; border: 0"></iframe>
          </div>
          <div style="flex: 0 0 calc(50% - 8px); aspect-ratio: 16 / 9; background: #f2f2f2; scroll-snap-align: start">
            <iframe src="https://www.youtube-nocookie.com/embed/YWmxAobvijA" title="Selected editing work 3" loading="lazy" allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" style="display: block; width: 100%; height: 100%; border: 0"></iframe>
          </div>
          <div style="flex: 0 0 calc(50% - 8px); aspect-ratio: 16 / 9; background: #f2f2f2; scroll-snap-align: start">
            <iframe src="https://www.youtube-nocookie.com/embed/XbocN-a4kyI" title="Selected editing work 4" loading="lazy" allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" style="display: block; width: 100%; height: 100%; border: 0"></iframe>
          </div>
          <div style="flex: 0 0 calc(50% - 8px); aspect-ratio: 16 / 9; background: #f2f2f2; scroll-snap-align: start">
            <iframe src="https://www.youtube-nocookie.com/embed/0DejBV3nrXE" title="Selected editing work 5" loading="lazy" allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" style="display: block; width: 100%; height: 100%; border: 0"></iframe>
          </div>

            <iframe src="https://www.youtube-nocookie.com/embed/Rv2fsEomp2E" title="Selected editing work 6" loading="lazy" allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" style="display: block; width: 100%; height: 100%; border: 0"></iframe>
          </div>
        </div>
      </section>

      <section data-reveal style="display: flex; flex-direction: column; gap: 22px">
        <h2 style="margin: 0; font-size: 12px; font-weight: 400; letter-spacing: 0.1em; text-transform: uppercase">Selected sound design work</h2>
        <div data-band style="display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 8px">
          <div style="flex: 0 0 calc(50% - 8px); aspect-ratio: 16 / 9; background: #f2f2f2; scroll-snap-align: start">
            <iframe src="https://www.youtube-nocookie.com/embed/o11isAn1UWc" title="Selected sound design work 1" loading="lazy" allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" style="display: block; width: 100%; height: 100%; border: 0"></iframe>

    <footer style="width: min(1320px, 100%); margin: 0 auto; padding: 14vh 0 0; display: flex; flex-direction: column; align-items: flex-start; gap: 14px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #111111">

      </div>
      <span>©2026 by Jodie Luk Lai Wa</span>
    </footer>
  </main>
</div>

<script>
  (function () {
    document.documentElement.classList.add("js");
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { if (e.isIntersecting) e.target.classList.add("is-in"); });
    }, { rootMargin: "0px 0px -8% 0px", threshold: 0.04 });
    document.querySelectorAll("[data-reveal]").forEach(function (el) { io.observe(el); });

    function scrollBand(index, dir) {
      var band = document.querySelectorAll("[data-band]")[index];
      if (!band) return;
      var item = band.querySelector(":scope > div");
      var step = item ? item.getBoundingClientRect().width + 16 : band.clientWidth;
      band.scrollBy({ left: dir * step, behavior: "smooth" });
    }
    document.querySelectorAll("[data-band-prev]").forEach(function (btn) {
      btn.addEventListener("click", function () { scrollBand(Number(btn.getAttribute("data-band-prev")), -1); });
    });
    document.querySelectorAll("[data-band-next]").forEach(function (btn) {
      btn.addEventListener("click", function () { scrollBand(Number(btn.getAttribute("data-band-next")), 1); });
    });
  })();
</script>
</body>
</html>
